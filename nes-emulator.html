async function load(f){
 const d=new Uint8Array(await f.arrayBuffer());
 if(d[0]!=78||d[1]!=69||d[2]!=83||d[3]!=26){running=false;return msg('NES ROM（iNES形式）ではありません。')}
 const np=d[4],nc=d[5];mp=d[6]>>4|d[7]&240;
 if(![0,1,2,3,4,7,11,34,66,71,206].includes(mp)){running=false;return msg('マッパー'+mp+'は未対応です（対応: 0, 1, 2, 3, 4, 7, 11, 34, 66, 71, 206）。')}
 let o=16+(d[6]&4?512:0);prg=d.slice(o,o+np*16384);o+=np*16384;
 chrRam=!nc;chr=nc?d.slice(o,o+nc*8192):new Uint8Array(8192);
 ram.fill(0);vram.fill(0);pal.fill(0);oam.fill(0);sram.fill(0);
 mir=d[6]&1;ctrl=mask=st=0;v=t=fx=w=buf=oa=0;rg=[12,0,0,0];ms=mn=0;c0=0;c1=4096;p0=0;p1=np>1?16384:0;
 if(mp==2||mp==71)p1=prg.length-16384;if(mp==7){p1=16384;mir=2}
 il=ic=ir=ie=iq=0;rg4=[0,2,4,5,6,7,0,1];bs=0;
 if(mp==4||mp==206)m3(0x8000,0);else if(mp==1)mw(0x8000,128);else sync();
 A=X=Y=0;S=0xfd;P=0x24;nmiP=0;cyc=0;cya=0;strobe=0;cs=0;pc=rd(0xfffc)|rd(0xfffd)<<8;
 const NM={0:'NROM',1:'MMC1',2:'UxROM',3:'CNROM',4:'MMC3',7:'AxROM',11:'Color Dreams',34:'BNROM',66:'GxROM',71:'Camerica',206:'DxROM'};let ut='';
 if(nc){const U=new Set;for(let i=0;i+16<=chr.length;i+=16)U.add(chr.slice(i,i+16).join());ut=' / ユニークタイル '+U.size+'/'+chr.length/16}
 $('i').textContent='PRG '+np*16+'KB / CHR '+(nc?nc*8+'KB':'RAM 8KB')+ut+' / マッパー'+mp+' ('+NM[mp]+') / '+(d[6]&8?'4画面':d[6]&1?'垂直':'水平')+'ミラー'+(d[6]&2?' / バッテリー':'')+((d[7]&12)==8?' / NES 2.0':'');
 ch.forEach((c,k)=>Object.assign(c,mk()));lr=lc=lrv=0;ns=1;
 if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)();sr=ac.sampleRate}catch(e){}
 if(ac&&ac.state=='suspended')ac.resume();
 running=true;msg(f.name+' を実行中')}
const KM={KeyX:1,KeyZ:2,ShiftLeft:4,ShiftRight:4,Enter:8,ArrowUp:16,ArrowDown:32,ArrowLeft:64,ArrowRight:128};
addEventListener('keydown',e=>{if(KM[e.code]){pad|=KM[e.code];e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.code]){pad&=~KM[e.code];e.preventDefault()}});
$('f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const dz=$('dz');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
dz.ondragleave=()=>dz.classList.remove('on');
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('on');const f=e.dataTransfer.files[0];f&&load(f)});
// ---- 3D view: 画面を層ごとに押し出す（背景=中, 前面スプライト=高, 背面スプライト=低）
let v3=false,R,sc,cam,mesh,tcx,tly,ry=0,rx=-.3,zoom=400;
function init3(){
 if(!window.THREE){msg('3D 表示には three.js の読み込み（ネット接続）が必要です。');return false}
 const T=THREE;
 R=new T.WebGLRenderer({canvas:$('d')});R.setSize(768,720,false);
 sc=new T.Scene();cam=new T.PerspectiveCamera(40,768/720,1,3000);
 tcx=new T.DataTexture(new Uint8Array(im.data.buffer),256,240,T.RGBAFormat);
 tly=new T.DataTexture(lay,256,240,T.LuminanceFormat);
 const M=new T.ShaderMaterial({uniforms:{tc:{value:tcx},tl:{value:tly}},
 vertexShader:'uniform sampler2D tc,tl;varying vec3 vc;void main(){vec2 g=instanceMatrix[3].xy;vec2 uv=vec2(g.x+128.,120.-g.y)/vec2(256.,240.);vec3 c=texture2D(tc,uv).rgb;float L=texture2D(tl,uv).r*255.;float h=max(L*3.,.4);vec3 p=position;p.z=(p.z+.5)*h;float l=.55+.45*max(dot(normal,normalize(vec3(.3,.5,1.))),0.);vc=c*l;gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(p,1.);}',
 fragmentShader:'varying vec3 vc;void main(){gl_FragColor=vec4(vc,1.);}'});
 mesh=new T.InstancedMesh(new T.BoxGeometry(1,1,1),M,61440);mesh.frustumCulled=false;
 const m=new T.Matrix4();let k=0;
 for(let r=0;r<240;r++)for(let c=0;c<256;c++){m.setPosition(c-127.5,119.5-r,0);mesh.setMatrixAt(k++,m)}
 sc.add(mesh);cam.position.set(0,0,zoom);return true}
function draw3(){tcx.needsUpdate=true;tly.needsUpdate=true;mesh.rotation.set(rx,ry,0);cam.position.z=zoom;R.render(sc,cam)}
function set3(on){if(on&&!R&&!init3())return;v3=on;$('d').style.display=on?'block':'none';$('s').style.display=on?'none':'block';$('b2').setAttribute('aria-pressed',String(!on));$('b3').setAttribute('aria-pressed',String(on));if(on)draw3()}
$('b2').onclick=()=>set3(false);$('b3').onclick=()=>set3(true);
const dc=$('d');let dr=null;
dc.onpointerdown=e=>{dr=[e.clientX,e.clientY];dc.setPointerCapture(e.pointerId);dc.style.cursor='grabbing'};
dc.onpointermove=e=>{if(!dr)return;ry+=(e.clientX-dr[0])*.008;rx+=(e.clientY-dr[1])*.008;dr=[e.clientX,e.clientY]};
dc.onpointerup=()=>{dr=null;dc.style.cursor='grab'};
dc.onwheel=e=>{e.preventDefault();zoom=Math.max(150,Math.min(900,zoom*(e.deltaY>0?1.08:.92)))};
let last=0,acc=0;
function tick(ts){requestAnimationFrame(tick);if(!running){last=ts;if(v3)draw3();return}
 acc+=Math.min(ts-last,50);last=ts;let n=0;
 try{while(acc>=16.64&&n++<3){frame();snd();acc-=16.64}}catch(e){running=false;msg('エラー: '+e.message)}if(v3)draw3()}
requestAnimationFrame(tick);
