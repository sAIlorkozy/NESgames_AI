<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きこりの与作（カセットビジョン風）</title>
<style>
:root{--bg:#f3efe6;--fg:#2b2418;--bt:#d9cdb4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a16;--fg:#eee6d4;--bt:#3a352b}}
:root[data-theme="dark"]{--bg:#1c1a16;--fg:#eee6d4;--bt:#3a352b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
h1{font-size:1.1rem;margin:0}
canvas{width:min(100%,664px);aspect-ratio:166/120;image-rendering:pixelated;border:4px solid var(--fg);border-radius:6px;background:#000;touch-action:none}
.pad{display:flex;justify-content:space-between;width:min(100%,664px)}
.pad div{display:flex;gap:10px}
button{font:inherit;font-size:1.1rem;min-width:64px;min-height:56px;border:2px solid var(--fg);border-radius:10px;background:var(--bt);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(.8)}
p{margin:0;font-size:.85rem;max-width:664px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<h1>きこりの与作</h1>
<canvas id="c" width="166" height="120"></canvas>
<div class="pad">
  <div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
  <div><button data-k="KeyX">ジャンプ</button><button data-k="KeyZ">おの</button></div>
</div>
<p>←→ 移動 ／ Z・スペース おの（木の根元に当てて切る。左右から5回ずつ切ると倒れます）／ X・↑ ジャンプ。蛇は地面の下から這い上がってきます。イノシシは横から来ます。どちらもおので倒せます。木から落ちる枯葉や鳥のふんに当たると、しびれて動けなくなります。</p>
<script>
const W=166,H=120,G=95;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const keys={};
const COL={bg:'#000',gr:'#40d84a',trunk:'#e0c0b8',can:'#ffb400',pl:'#ff5a38',axe:'#20c8d8',pk:'#ff20c0',bl:'#1890ff',rd:'#ff5a38',sc:'#50e060',lf:'#20c8d8'};
let mode='title',st,p,trees,en,br,dr,bird,tS,tB,ac,last=0,frame=0,flash=0,intro=0,chips=[];

/* ---- sound ---- */
function beep(f,d,t,v,fe){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=t||'square';o.frequency.setValueAtTime(f,n);
    if(fe)o.frequency.linearRampToValueAtTime(fe,n+d);
    g.gain.value=v||.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d);
  }catch(e){}
}
function seq(a){let t=0;a.forEach(([f,d])=>{setTimeout(()=>beep(f,d*.92),t*1000);t+=d})}
/* ベートーヴェン「運命」の動機（パブリックドメイン） */
const FATE1=[[334,.28],[334,.28],[334,.28],[262,.9]],FATE2=[[258,.28],[258,.28],[258,.28],[215,.9]];

/* ---- input ---- */
const alias={Space:'KeyZ',ArrowUp:'KeyX'};
addEventListener('keydown',e=>{
  const k=alias[e.code]||e.code;keys[k]=1;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code))e.preventDefault();
  if(mode!=='play'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'))begin();
});
addEventListener('keyup',e=>{keys[alias[e.code]||e.code]=0});
cv.addEventListener('pointerdown',()=>{if(mode!=='play')begin()});
document.querySelectorAll('button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(mode!=='play'&&(k==='KeyZ'||k==='KeyX'))begin()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0));
});

/* ---- sprites (動画のコマから起こしたドット絵) ---- */
const BODY=[
"........XXXX....",
"........XXXX....",
"........XXXX....",
"..XXXXXXXXXXXXXX",
"..XXXXXXXXXXXXXX",
"........XXXX..XX",
"........XXXX..XX",
"........XXXX....",
"......XXXXXXXX..",
"......XX....XX..",
"......XX....XX..",
"....XXXX....XXXX"];
const LEGB=[
"......XXXXXXXX..",
".....XX......XX.",
"....XX........XX",
"...XX.........XX"];
const CROUCH=[
"................",
"................",
"................",
"........XXXX....",
"........XXXX....",
"........XXXX....",
"......XXXXXXXXXX",
"......XXXXXXXXXX",
"......XXXXXXXX..",
"....XXXXXXXXXX..",
"....XX......XX..",
"...XXX......XXXX"];
const BOAR=[
"........XXXXXXXX..",
".......XXXXXXXXXX.",
"......XXXXXXXXXXXX",
".....XXXXXXXXXXXX.",
"...XXXXXXXXXXXXX..",
"..XXXXXXXXXXXXX...",
"....XXX.....XXX...",
];
const BOAR_L=["...XX........XX...","....XX......XX...."];
const SNAKE=["....XX","...XX.","..XX..","...XX.","....XX","...XX.","..XX..","...XX.","....XX","...XX.","..XX.."];
const HEAP=[
".......XX.....",
".......XX.....",
".......XX.....",
".......XX.....",
".......XX.....",
"..XX...XX.XX..",
"..XX...XX.XX..",
"XXXXXXXXXXXXXX",
"XXXXXXXXXXXXXX",
"XXXXXXXXXXXXXX"];
const CROSS=[
"..XXX..",
"..XXX..",
"XXXXXXX",
"XXXXXXX",
"X.XXX.X",
"..XXX..",
"..XXX..",
"..XXX.."];

/* cells: sprite rows -> pixels. ox = anchor x, f = facing(1/-1), cc = centre column */
function spr(rows,ax,top,f,cc,col,extra){
  const put=(c,r,color)=>{
    const dx=f>0?c-cc:cc-1-c;
    R(color,ax+dx,top+r,1,1);
  };
  rows.forEach((s,r)=>{for(let c=0;c<s.length;c++){const ch=s[c];if(ch==='X')put(c,r,col);else if(ch==='C')put(c,r,COL.axe)}});
  if(extra)extra.forEach(([c,r])=>put(c,r,COL.axe));
}

/* ---- setup ---- */
function begin(){st={stage:1,score:0,lives:6,clear:0,dead:0};newStage();mode='play';seq(FATE1);setTimeout(()=>seq(FATE2),1400)}
function newStage(){
  trees=[42,109].map(tx=>({x:tx,hl:7,hr:7,gone:false,blink:0}));
  resetField();intro=140;
}
function resetField(){
  p={x:83,y:0,vy:0,f:1,ax:0,stun:0,step:0,mv:false};
  en=[];br=[];dr=[];chips=[];
  bird={on:false,x:0,d:1,t:200,cd:0};
  tS=120;tB=220;
}
const rnd=n=>Math.random()*n;

/* ---- update ---- */
const DEAD_T=195;
function die(){
  st.dead=DEAD_T;st.lives--;flash=0;
  [.2,.44,.68].forEach(t=>setTimeout(()=>beep(334,.1,'square',.05),t*1000));
  setTimeout(()=>beep(258,1.18,'square',.05),1060);
}
function thudSound(){
  beep(247,.05,'square',.05,247);
  setTimeout(()=>beep(130,.045,'square',.05),55);
}
function chirpSound(){
  [1975,880,1975,880].forEach((f,i)=>setTimeout(()=>beep(f,.02,'square',.04),100+i*20));
}
/* 敵をやっつけた音（動画：約1044Hzが2秒ちょっと細かく途切れながら続く） */
function defeatSound(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+.05;
    o.type='square';o.frequency.value=1044;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0,n);
    for(let i=0;i<90;i++){g.gain.setValueAtTime(.05,n+i*.025);g.gain.setValueAtTime(0,n+i*.025+.02)}
    o.start(n);o.stop(n+2.3);
  }catch(e){}
}
function tick(){beep(3133,.012,'square',.04)}
function snakeSound(){
  tick();
  setTimeout(()=>beep(4600,.05,'square',.07),40);
  [110,150,190,230].forEach(t=>setTimeout(tick,t));
}
function boarSound(){[0,280,560].forEach(t=>setTimeout(()=>beep(220,.1,'square',.05,150),t))}
function stunSound(){
  [1044,880,1044,880,1044,880,1044,880].forEach((f,i)=>setTimeout(()=>beep(f,.04,'square',.04),i*45));
}
/* やられて昇っていくときの曲（元の曲は著作物のためオリジナルの代わりの曲） */
function riseJingle(){seq([[392,.3],[440,.3],[523,.3],[440,.3],[392,.3],[330,.3],[392,.6],[330,.3],[294,.3],[330,.3],[392,.6]])}
function snakeStep(e){
  e.age=(e.age||0)+1;e.f=((e.age/5|0)%2)?1:-1;
  if(p&&e.ph<2)e.x+=(p.x>e.x?1:-1)*.03;
  if(e.ph===0){e.top-=.13;if(e.top<=G-4){e.top=G-4;e.ph=1;e.hold=40}}
  else if(e.ph===1){if(--e.hold<=0)e.ph=2}
  else{e.top+=.165;if(e.top>110)e.dead=1}
}
function enemyAnim(e){
  if(e.wait>0){e.wait--;return true}
  if(e.dying>0){if(--e.dying===0)e.dead=1;return true}
  return false;
}
function update(){
  frame++;
  if(mode!=='play')return;
  if(intro>0){intro--;return}
  if(st.clear>0){
    if(--st.clear===0){st.stage++;newStage()}
    return;
  }
  if(st.dead>0){
    const e0=DEAD_T-st.dead;
    flash=((e0>=9&&e0<18)||(e0>=39&&e0<45))?1:0;
    if(e0===87)riseJingle();
    for(const e of en){if(enemyAnim(e))continue;if(e.t==='s')snakeStep(e);else e.x+=e.d*e.v}
    en=en.filter(e=>!e.dead&&(e.t==='s'||(e.x>-20&&e.x<W+20)));
    if(--st.dead===0){flash=0;if(st.lives<=0)mode='over';else resetField()}
    return;
  }
  let moving=false;
  if(p.stun>0)p.stun--;
  else{
    if(p.ax===0&&p.y===0&&p.vy===0){
      if(keys.ArrowLeft){p.x-=.28;p.f=-1;moving=true}
      if(keys.ArrowRight){p.x+=.28;p.f=1;moving=true}
    }
    p.x=Math.max(10,Math.min(W-10,p.x));
    if(keys.KeyX&&p.y===0&&p.vy===0){p.vy=2.1;beep(248,.15,'square',.05,883)}
    if(keys.KeyZ&&p.ax===0&&p.y===0){
      p.ax=18;thudSound();
      for(const t of trees){
        const left=p.x<t.x;
        if(!t.gone&&t.blink===0&&p.f===(left?1:-1)&&Math.abs(p.x+p.f*12-t.x)<5&&(left?t.hl:t.hr)>0){
          if(left)t.hl--;else t.hr--;
          chirpSound();st.score+=50;
          if(t.hl<=0&&t.hr<=0){t.blink=21;st.score+=50;beep(4600,.05,'square',.07)}
        }
      }
    }
  }
  p.mv=moving;
  if(moving&&p.y===0&&++p.step%12===0)beep(883,.04,'square',.03);
  if(p.stun===0&&(p.y>0||p.vy>0)){p.y+=p.vy;p.vy-=.1125;if(p.y<=0){p.y=0;p.vy=0}}
  if(p.ax>0)p.ax--;
  for(const t of trees)if(t.blink>0&&--t.blink===0)t.gone=true;

  if(trees.every(t=>t.gone)){st.clear=90;st.score+=st.stage*200;en=[];br=[];dr=[];bird.on=false;seq([[441,.3],[441,.15],[441,.5]]);return}

  /* 枯葉（当たると痺れるだけ） */
  for(const t of trees){
    if(!t.gone&&Math.abs(p.x-t.x)<16&&Math.random()<.015+.004*st.stage)br.push({x:t.x+rnd(14)-7,y:40});
  }
  for(const b of br){
    b.y+=.8+.125*st.stage;
    if(p.stun===0&&Math.abs(b.x-p.x)<5&&b.y>G-p.y-14&&b.y<G-p.y+1){p.stun=120;b.y=G+5;stunSound()}
  }
  br=br.filter(b=>b.y<G);

  /* snake: 地面の下から這い上がり、顔を出してまた潜る */
  if(--tS<=0){
    en.push({t:'s',x:12+rnd(W-24),top:106,ph:0,hold:0,f:1});snakeSound();
    tS=Math.max(160,340-st.stage*28)+rnd(140);
  }
  /* boar: 横から走ってくる */
  if(--tB<=0){
    const fromL=Math.random()<.5;
    en.push({t:'b',x:fromL?-12:W+12,d:fromL?1:-1,v:.70+.06*(st.stage-1),wait:20});boarSound();
    tB=Math.max(180,400-st.stage*32)+rnd(160);
  }
  for(const e of en){
    if(enemyAnim(e))continue;
    if(e.t==='s'){
      snakeStep(e);
      const out=e.top<G-1;
      if(out&&p.ax>=10&&p.y<4&&Math.abs(e.x-(p.x+p.f*13))<10){e.dying=66;st.score+=50;defeatSound()}
      else if(out&&p.y<5&&Math.abs(e.x-p.x)<5){die();return}
    }else{
      e.x+=e.d*e.v;
      if(p.ax>=10&&p.y<4&&Math.abs(e.x-(p.x+p.f*13))<10){e.dying=66;st.score+=100;defeatSound()}
      else if(p.y<9&&Math.abs(e.x-p.x)<8){die();return}
    }
  }
  en=en.filter(e=>!e.dead&&(e.t==='s'||(e.x>-20&&e.x<W+20)));

  /* bird */
  if(!bird.on){if(--bird.t<=0){bird.on=true;bird.d=Math.random()<.5?1:-1;bird.x=bird.d>0?-8:W+8;bird.cd=0}}
  else{
    bird.x+=bird.d*.9;bird.cd--;
    if(bird.cd<=0&&Math.abs(bird.x-p.x)<14&&Math.random()<.1){dr.push({x:bird.x,y:16});bird.cd=80;tick()}
    if(bird.x<-12||bird.x>W+12){bird.on=false;bird.t=200+rnd(280)}
  }
  for(const d of dr){
    d.y+=1.1;
    if(p.stun===0&&Math.abs(d.x-p.x)<5&&d.y>G-p.y-14&&d.y<G-p.y+1){p.stun=120;d.y=G+5;stunSound()}
  }
  dr=dr.filter(d=>d.y<G);
}

/* ---- draw ---- */
function R(c,a,b,w,h){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),w,h)}
const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg','-':'g'};
function digit(ch,ox,oy,c){
  const m={a:[0,0,8,2],b:[6,0,2,6],c:[6,4,2,6],d:[0,8,8,2],e:[0,4,2,6],f:[0,0,2,6],g:[0,4,8,2]};
  for(const k of SEG[ch]||'')R(c,ox+m[k][0],oy+m[k][1],m[k][2],m[k][3]);
}
function num(str,ox,oy,c,pitch){[...String(str)].forEach((ch,i)=>digit(ch,ox+i*(pitch||11),oy,c))}
function txt(s,a,b,c){x.fillStyle=c;x.font='bold 8px monospace';x.textAlign='center';x.fillText(s,a,b)}
function drawTree(t){
  const cx=t.x,top=29;
  R(COL.trunk,cx-3,top+14,7,G-top-14);
  R(COL.can,cx-5,top,10,3);R(COL.can,cx-8,top+3,16,3);R(COL.can,cx-11,top+6,22,3);R(COL.can,cx-14,top+9,28,3);R(COL.can,cx-16,top+12,32,2);
  if(t.blink>0&&((t.blink/3|0)&1))R('#ff20c0',cx-3,top+14,7,G-top-14);
  const PL=['#1890ff','#ff20c0','#40e040','#ffe800','#20d8e8','#ffffff','#ff5a38'];
  const PR=['#ff5a38','#1890ff','#ff20c0','#40e040','#ffe800','#20d8e8','#ffffff'];
  const cl=7-t.hl,cr=7-t.hr;
  if(cl>0&&cl<7)R(PL[cl-1],cx-3,G-4,2,4);
  if(cr>0&&cr<7)R(PR[cr-1],cx+2,G-4,2,4);
  if(cl>=7){R(COL.bg,cx-3,G-5,2,5);R(COL.bg,cx-3,G-8,1,3)}
  if(cr>=7){R(COL.bg,cx+2,G-5,2,5);R(COL.bg,cx+3,G-8,1,3)}
}
function drawBoar(e){
  const f=e.d,fr=(frame>>3)&1;
  const rows=BOAR.concat([BOAR_L[e.dying>0?0:fr]]);
  spr(rows,e.x,G-rows.length,f,9,blinkCol(e));
}
function blinkCol(e){return e.dying>0&&(((66-e.dying)%9)>=6)?'#1890ff':COL.pk}
function drawSnake(e){
  const t=Math.round(e.top),f=e.f||1,xx=Math.round(e.x);
  R('#000',f>0?xx-3:xx-1,t,4,11);
  spr(SNAKE,xx,t,f,3,blinkCol(e));
}
function drawPlayer(forceIdle){
  const f=p.f,px=Math.round(p.x),cc=9;
  if(st.dead>0&&!forceIdle){
    const e0=DEAD_T-st.dead;
    if(e0<87){
      const c=flash>0?'#1890ff':(e0<9?COL.pl:COL.pk);
      spr(HEAP,px,G-10,1,7,c);
    }else{
      const cy=Math.max(33,G-14-(e0-87)*.6),jx=((e0>>3)&1)?0:1;
      spr(CROSS,px+jx,Math.round(cy),1,3,'#40ff40');
      R('#ffa500',px+jx-2,Math.round(cy)-3,4,1);
    }
    return;
  }
  const y=Math.round(G-p.y);
  let rows,extra=[],top;
  if(p.ax>0&&!forceIdle){
    rows=CROUCH;top=y-12;
    for(let i=0;i<9;i++)extra.push([14+i,7+Math.round(i*.5)]);
  }else if(p.y>0||p.mv){
    rows=BODY.slice();
    if(p.y===0&&((frame>>3)&1))rows=rows.slice(0,8).concat(LEGB);
    top=y-12;
    for(let r=-4;r<=4;r++){extra.push([2,r]);extra.push([3,r])}
    for(let c=2;c<=5;c++)extra.push([c,-4]);
  }else{
    rows=BODY.slice();top=y-12;
    for(let r=4;r<=11;r++){extra.push([2,r]);extra.push([3,r])}
    for(let c=0;c<=3;c++)extra.push([c,11]);
  }
  if(p.stun>0&&!forceIdle&&((frame>>2)&1))return;
  spr(rows,px,top,f,cc,COL.pl,extra);
}
function draw(){
  R(flash>0?'#ff5030':COL.bg,0,0,W,H);
  R(COL.gr,0,G,W,H-G);
  for(const t of trees)if(!t.gone)drawTree(t);
  for(const b of br){R('#ffd800',b.x,b.y,1,1);R('#ffd800',b.x+1,b.y+1,1,1);R('#ffd800',b.x+2,b.y+2,1,1)}
  for(const e of en)e.t==='b'?drawBoar(e):drawSnake(e);
  if(bird.on){
    const c=Math.floor(frame/80)%2?COL.rd:COL.bl,up=frame>>3&1;
    R(c,bird.x-3,14,7,2);R(c,bird.x-3+(bird.d>0?0:4),up?11:17,3,1);R(c,bird.x+bird.d*4,15,2,1);
  }
  for(const d of dr)R(Math.floor(d.y/20)%2?COL.rd:COL.bl,d.x,d.y,2,2);
  drawPlayer(mode==='title'||mode==='over');
  /* HUD（メッセージは出さない） */
  num(Math.max(st.lives,0),15,9,COL.lf);
  if(mode==='play'&&intro>0)num('1-'+st.stage,65,9,COL.sc,11);
  else num(String(st.score%10000).padStart(4,'0'),92,9,COL.sc,11);
}
function loop(t){
  requestAnimationFrame(loop);
  if(t-last<33)return;
  last=t;update();draw();
}
st={score:0,lives:6,stage:1,clear:0,dead:0};newStage();intro=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
